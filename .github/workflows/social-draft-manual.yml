name: Draft social posts manually

on:
  workflow_dispatch:
    inputs:
      article_url:
        description: Published article URL
        required: true
        type: string
        default: https://robintegg.com/2026/11/15/java-to-mobile-with-teavm-and-capacitor.html

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup JBang
        uses: jbangdev/setup-jbang@v0.1.1

      - name: Draft social posts
        run: jbang scripts/social/Social.java draft-article --url "$ARTICLE_URL"
        env:
          ARTICLE_URL: ${{ inputs.article_url }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Open social review pull request
        run: |
          branch="social/manual-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add scripts/social/queue
          git commit -m "Draft social posts for review"
          git push origin "$branch"
          gh pr create --base master --head "$branch" \
            --title "Review social posts" \
            --body "Edit the text under each platform, or set a platform to \`skipped\`. Merging publishes every platform marked \`ready\`."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
