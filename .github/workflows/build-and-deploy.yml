name: Build and deploy

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      models: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/cache@v6
        with:
          path: ~/.jbang
          key: ${{ runner.os }}-jbang-${{ hashFiles('README.md', 'site-config.xml', '.github/workflows/build-and-deploy.yml') }}
          restore-keys: |
            ${{ runner.os }}-jbang-

      - name: Setup JBang
        uses: jbangdev/setup-jbang@v0.1.1

      - name: Save live feed for social drafts
        run: curl -fsSL https://robintegg.com/feed.xml -o "$RUNNER_TEMP/old-feed.xml" || : > "$RUNNER_TEMP/old-feed.xml"

      - name: Build with JBang
        run: |
          if [ -z "$POSTHOG_KEY" ]; then
            echo "::error::The POSTHOG_KEY repository Actions secret must be configured."
            exit 1
          fi
          jbang --fresh io.github.teggr:electrostatic-cli:0.0.6 build
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}

      - name: Publish
        uses: South-Paw/action-netlify-cli@v2
        id: netlify
        with:
          # be sure to escape any double quotes with a backslash and note that the --json
          # flag has been passed when deploying - if you want the outputs to work you'll need to include it
          args: 'deploy --json --prod --dir \"./generated-site\" --message \"production [${{ github.sha }}]\"'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Draft social posts
        continue-on-error: true
        run: jbang scripts/social/Social.java draft --old-feed "$RUNNER_TEMP/old-feed.xml" --new-feed generated-site/feed.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Open social review pull request
        continue-on-error: true
        run: |
          if [ -z "$(git status --porcelain scripts/social/queue)" ]; then exit 0; fi
          branch="social/${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add scripts/social/queue
          git commit -m "Draft social posts for review"
          git push origin "$branch"
          gh pr create --base master --head "$branch" \
            --title "Review social posts" \
            --body "Edit the text under each platform, or set a platform to \`skipped\`. Merging publishes every platform marked \`ready\`."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
